name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Linter
        run: npm run lint
      - name: Formateador
        run: npm run format:check
      - name: Pruebas
        run: npm test
        env: { JWT_SECRET: secreto-solo-para-pruebas }
      - name: Análisis de calidad (SonarQube / SonarCloud)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  desplegar:
    # Solo se publica si todo lo anterior pasó
    needs: calidad
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Publicar en Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
